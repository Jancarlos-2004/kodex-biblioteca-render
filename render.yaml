services:
  - type: web
    name: kodex-biblioteca
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      # Render entrega connectionString como postgres://usuario:clave@host/bd,
      # que NO es válido para JDBC. Usamos las propiedades separadas.
      - key: PGHOST
        fromDatabase:
          name: kodex-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: kodex-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: kodex-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: kodex-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: kodex-db
          property: password

databases:
  - name: kodex-db
    plan: free
    databaseName: kodex_db
    postgresMajorVersion: "17"
