<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Lector - KODEX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/kodex.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div id="page-content-wrapper">
        <div th:replace="~{layout/topbar :: topbar}"></div>
        <main class="main-content">
            <div th:replace="~{layout/alerts :: alerts}"></div>

            <div class="card shadow-sm border p-4 mx-auto" style="max-width: 650px;">
                <div class="d-flex align-items-center mb-3 pb-3 border-bottom">
                    <i class="fa-solid fa-address-card text-primary fs-3 me-3"></i>
                    <div>
                        <h4 class="fw-bold mb-0" th:text="${lector.idLector == null ? 'Registrar Nuevo Lector' : 'Editar Datos de Lector'}">Lector</h4>
                        <small class="text-muted">Registro con validación de documento único obligatorio (SDD-05).</small>
                    </div>
                </div>

                <form th:action="@{/lectores/guardar}" th:object="${lector}" method="post">
                    <input type="hidden" th:field="*{idLector}">

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="documento" class="form-label">Documento de Identidad *</label>
                            <input type="text" th:field="*{documento}" class="form-control" th:errorclass="is-invalid" placeholder="Ej. 1098765432" required>
                            <div class="invalid-feedback" th:errors="*{documento}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="estado" class="form-label">Estado del Lector *</label>
                            <select th:field="*{estado}" class="form-select" required>
                                <option th:each="est : ${estados}" th:value="${est}" th:text="${est.nombreVisible}">ACTIVO</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre Completo *</label>
                        <input type="text" th:field="*{nombre}" class="form-control" th:errorclass="is-invalid" placeholder="Nombres y apellidos..." required>
                        <div class="invalid-feedback" th:errors="*{nombre}"></div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="correo" class="form-label">Correo Electrónico *</label>
                            <input type="email" th:field="*{correo}" class="form-control" th:errorclass="is-invalid" placeholder="correo@institucion.edu" required>
                            <div class="invalid-feedback" th:errors="*{correo}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="telefono" class="form-label">Teléfono Móvil</label>
                            <input type="text" th:field="*{telefono}" class="form-control" placeholder="Ej. 3101234567">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a th:href="@{/lectores}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Lector
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/kodex.js}"></script>
</body>
</html>
