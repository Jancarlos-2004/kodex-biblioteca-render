<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo != null ? titulo + ' - KODEX' : 'KODEX - Sistema Bibliotecario UTS'}">KODEX</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Estilos Corporativos KODEX -->
    <link th:href="@{/css/kodex.css}" rel="stylesheet">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar Navigation -->
        <div th:replace="~{layout/sidebar :: sidebar}"></div>

        <!-- Content Wrapper -->
        <div id="page-content-wrapper">
            <!-- Top Navigation Bar -->
            <div th:replace="~{layout/topbar :: topbar}"></div>

            <!-- Page Main Content Area -->
            <main class="main-content">
                <!-- Flash Messages -->
                <div th:replace="~{layout/alerts :: alerts}"></div>

                <!-- Contenido Inyectado por Vistas Hijas -->
                <div th:replace="${contenido}"></div>
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script KODEX -->
    <script th:src="@{/js/kodex.js}"></script>
</body>
</html>
