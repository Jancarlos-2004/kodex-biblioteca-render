<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Usuario - KODEX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/kodex.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div id="page-content-wrapper">
        <div th:replace="~{layout/topbar :: topbar}"></div>
        <main class="main-content">
            <div th:replace="~{layout/alerts :: alerts}"></div>

            <div class="card shadow-sm border p-4 max-w-700 mx-auto" style="max-width: 680px;">
                <div class="d-flex align-items-center mb-3 pb-3 border-bottom">
                    <i class="fa-solid fa-user-gear text-primary fs-3 me-3"></i>
                    <div>
                        <h4 class="fw-bold mb-0" th:text="${usuario.idUsuario == null ? 'Nuevo Usuario del Sistema' : 'Editar Usuario'}">Usuario</h4>
                        <small class="text-muted">Asigne credenciales y perfil de permisos conforme a la arquitectura SDD.</small>
                    </div>
                </div>

                <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                    <input type="hidden" th:field="*{idUsuario}">

                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre Completo *</label>
                        <input type="text" th:field="*{nombre}" class="form-control" th:errorclass="is-invalid" placeholder="Ej. Paola Velasco" required>
                        <div class="invalid-feedback" th:errors="*{nombre}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo Electrónico (Login) *</label>
                        <input type="email" th:field="*{correo}" class="form-control" th:errorclass="is-invalid" placeholder="ejemplo@kodex.com" required>
                        <div class="invalid-feedback" th:errors="*{correo}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="nuevaClave" class="form-label"
                               th:text="${usuario.idUsuario == null ? 'Contraseña *' : 'Cambiar Contraseña (dejar en blanco para conservar la actual)'}">Contraseña</label>
                        <input type="password" name="nuevaClave" id="nuevaClave" class="form-control" placeholder="••••••••">
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="rol" class="form-label">Rol del Sistema *</label>
                            <select th:field="*{rol}" class="form-select" required>
                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r.nombreVisible}">ADMIN</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="idLector" class="form-label">Vincular con Lector (Portal)</label>
                            <select name="idLector" id="idLector" class="form-select">
                                <option value="">-- Sin Lector Asociado --</option>
                                <option th:each="l : ${lectores}"
                                        th:value="${l.idLector}"
                                        th:text="${l.documento + ' - ' + l.nombre}"
                                        th:selected="${usuario.lector != null && usuario.lector.idLector == l.idLector}">Lector</option>
                            </select>
                            <div class="form-text small">Requerido si el rol es LECTOR para que acceda a su portal (SDD-24).</div>
                        </div>
                    </div>

                    <div class="mb-4 form-check form-switch">
                        <input type="checkbox" class="form-check-input" th:field="*{activo}" id="activo">
                        <label class="form-check-label" for="activo">Usuario Activo (Permite iniciar sesión)</label>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Usuario
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/kodex.js}"></script>
</body>
</html>
