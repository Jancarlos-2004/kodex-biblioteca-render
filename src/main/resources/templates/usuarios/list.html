<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios y Roles - KODEX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/kodex.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div id="page-content-wrapper">
        <div th:replace="~{layout/topbar :: topbar}"></div>
        <main class="main-content">
            <div th:replace="~{layout/alerts :: alerts}"></div>

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold text-dark mb-1">
                        <i class="fa-solid fa-users-gear text-primary me-2"></i>Gestión de Usuarios y Roles
                    </h3>
                    <p class="text-muted small mb-0">Administración de cuentas, credenciales de acceso y asignación de los 6 roles.</p>
                </div>
                <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">
                    <i class="fa-solid fa-user-plus me-1"></i> Crear Usuario
                </a>
            </div>

            <!-- Barra de Búsqueda -->
            <div class="card p-3 mb-4 border shadow-sm">
                <form th:action="@{/usuarios}" method="get" class="row g-2">
                    <div class="col-md-10">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                            <input type="text" name="buscar" th:value="${buscar}" class="form-control" placeholder="Buscar por nombre o correo electrónico...">
                        </div>
                    </div>
                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-secondary w-100">Buscar</button>
                        <a th:href="@{/usuarios}" class="btn btn-outline-secondary" title="Limpiar"><i class="fa-solid fa-rotate-right"></i></a>
                    </div>
                </form>
            </div>

            <!-- Tabla de Usuarios -->
            <div class="card card-table">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Correo Electrónico</th>
                                <th>Rol Asignado</th>
                                <th>Lector Vinculado</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${usuarios}">
                                <td class="fw-semibold text-dark" th:text="${u.nombre}">Nombre</td>
                                <td>
                                    <span class="text-muted" th:text="${u.correo}">correo@ejemplo.com</span>
                                </td>
                                <td>
                                    <span class="badge bg-primary" th:text="${u.rol.nombreVisible}">ADMIN</span>
                                </td>
                                <td>
                                    <span th:if="${u.lector != null}" class="badge bg-light text-dark border">
                                        <i class="fa-solid fa-link me-1"></i>
                                        <span th:text="${u.lector.nombre}">Lector</span>
                                    </span>
                                    <span th:unless="${u.lector != null}" class="text-muted small">Ninguno</span>
                                </td>
                                <td>
                                    <span th:if="${u.activo}" class="badge bg-success-subtle text-success border border-success-subtle">Activo</span>
                                    <span th:unless="${u.activo}" class="badge bg-danger-subtle text-danger border border-danger-subtle">Inactivo</span>
                                </td>
                                <td class="text-end">
                                    <div class="d-inline-flex gap-1">
                                        <a th:href="@{/usuarios/editar/{id}(id=${u.idUsuario})}" class="btn btn-sm btn-outline-primary" title="Editar">
                                            <i class="fa-solid fa-pen-to-square"></i>
                                        </a>
                                        <form th:action="@{/usuarios/toggle-estado/{id}(id=${u.idUsuario})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm"
                                                    th:classappend="${u.activo ? 'btn-outline-warning' : 'btn-outline-success'}"
                                                    th:title="${u.activo ? 'Desactivar cuenta' : 'Activar cuenta'}"
                                                    th:data-confirm="${u.activo ? '¿Desea desactivar la cuenta de este usuario?' : '¿Desea activar esta cuenta?'}">
                                                <i class="fa-solid" th:classappend="${u.activo ? 'fa-ban' : 'fa-check'}"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/kodex.js}"></script>
</body>
</html>
