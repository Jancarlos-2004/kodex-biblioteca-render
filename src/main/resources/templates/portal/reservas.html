<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reservas - Portal KODEX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/kodex.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div id="page-content-wrapper">
        <div th:replace="~{layout/topbar :: topbar}"></div>
        <main class="main-content">
            <div th:replace="~{layout/alerts :: alerts}"></div>

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold text-dark mb-1">
                        <i class="fa-solid fa-calendar-check text-primary me-2"></i>Mis Reservas
                    </h3>
                    <p class="text-muted small mb-0">Seguimiento de libros apartados en lista de espera (SDD-16, SDD-24).</p>
                </div>
                <a th:href="@{/catalogo}" class="btn btn-primary btn-sm">
                    <i class="fa-solid fa-magnifying-glass me-1"></i> Buscar Libros
                </a>
            </div>

            <div class="card card-table">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Libro Reservado</th>
                                <th>Fecha Solicitud</th>
                                <th>Vigencia Hasta</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${reservas}">
                                <td>
                                    <div class="fw-semibold text-dark" th:text="${r.libro.titulo}">Título</div>
                                    <small class="text-muted" th:text="${r.libro.autor}">Autor</small>
                                </td>
                                <td th:text="${r.fechaSolicitud}">2026-11-01</td>
                                <td>
                                    <span th:class="${r.expirada ? 'text-danger fw-bold' : 'text-dark'}" th:text="${r.fechaVencimiento}">2026-11-06</span>
                                </td>
                                <td>
                                    <span th:if="${r.estado.name() == 'ACTIVA'}" class="badge bg-primary">Activa</span>
                                    <span th:if="${r.estado.name() == 'ATENDIDA'}" class="badge bg-success">Atendida</span>
                                    <span th:if="${r.estado.name() == 'CANCELADA'}" class="badge bg-secondary">Cancelada</span>
                                    <span th:if="${r.estado.name() == 'EXPIRADA'}" class="badge bg-danger">Expirada</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(reservas)}">
                                <td colspan="4" class="text-center py-4 text-muted">No tiene reservas registradas actualmente.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/kodex.js}"></script>
</body>
</html>
