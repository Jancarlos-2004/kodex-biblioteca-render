<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Libro - KODEX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/kodex.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div id="page-content-wrapper">
        <div th:replace="~{layout/topbar :: topbar}"></div>
        <main class="main-content">
            <div th:replace="~{layout/alerts :: alerts}"></div>

            <div class="card shadow-sm border p-4 mx-auto" style="max-width: 700px;">
                <div class="d-flex align-items-center mb-3 pb-3 border-bottom">
                    <i class="fa-solid fa-book text-primary fs-3 me-3"></i>
                    <div>
                        <h4 class="fw-bold mb-0" th:text="${libro.idLibro == null ? 'Registrar Nuevo Libro' : 'Editar Libro'}">Libro</h4>
                        <small class="text-muted">Gestión de metadatos bibliográficos e ISBN único (SDD-02).</small>
                    </div>
                </div>

                <form th:action="@{/libros/guardar}" th:object="${libro}" method="post">
                    <input type="hidden" th:field="*{idLibro}">

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="isbn" class="form-label">Código ISBN *</label>
                            <input type="text" th:field="*{isbn}" class="form-control" th:errorclass="is-invalid" placeholder="Ej. 978-0134685991" required>
                            <div class="invalid-feedback" th:errors="*{isbn}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="categoria" class="form-label">Categoría Temática *</label>
                            <select th:field="*{categoria.idCategoria}" class="form-select" required>
                                <option value="">-- Seleccione Categoría --</option>
                                <option th:each="cat : ${categorias}" th:value="${cat.idCategoria}" th:text="${cat.nombre}">Categoría</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="titulo" class="form-label">Título de la Obra *</label>
                        <input type="text" th:field="*{titulo}" class="form-control" th:errorclass="is-invalid" placeholder="Título completo..." required>
                        <div class="invalid-feedback" th:errors="*{titulo}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="autor" class="form-label">Autor(es) *</label>
                        <input type="text" th:field="*{autor}" class="form-control" th:errorclass="is-invalid" placeholder="Nombre del autor o autores..." required>
                        <div class="invalid-feedback" th:errors="*{autor}"></div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-8">
                            <label for="editorial" class="form-label">Editorial *</label>
                            <input type="text" th:field="*{editorial}" class="form-control" th:errorclass="is-invalid" placeholder="Ej. Pearson, Addison-Wesley" required>
                            <div class="invalid-feedback" th:errors="*{editorial}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="anio" class="form-label">Año Publicación *</label>
                            <input type="number" th:field="*{anio}" class="form-control" th:errorclass="is-invalid" min="1000" max="2100" placeholder="Ej. 2024" required>
                            <div class="invalid-feedback" th:errors="*{anio}"></div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a th:href="@{/libros}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Libro
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/kodex.js}"></script>
</body>
</html>
