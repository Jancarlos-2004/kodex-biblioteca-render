<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Ejemplar - KODEX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/kodex.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div id="page-content-wrapper">
        <div th:replace="~{layout/topbar :: topbar}"></div>
        <main class="main-content">
            <div th:replace="~{layout/alerts :: alerts}"></div>

            <div class="card shadow-sm border p-4 mx-auto" style="max-width: 650px;">
                <div class="d-flex align-items-center mb-3 pb-3 border-bottom">
                    <i class="fa-solid fa-barcode text-primary fs-3 me-3"></i>
                    <div>
                        <h4 class="fw-bold mb-0" th:text="${ejemplar.idEjemplar == null ? 'Registrar Nuevo Ejemplar' : 'Editar Ejemplar'}">Ejemplar</h4>
                        <small class="text-muted">Asignación de código de inventario único y ubicación física (SDD-03).</small>
                    </div>
                </div>

                <form th:action="@{/ejemplares/guardar}" th:object="${ejemplar}" method="post">
                    <input type="hidden" th:field="*{idEjemplar}">

                    <div class="mb-3">
                        <label for="libro" class="form-label">Obra Bibliográfica (Libro) *</label>
                        <select th:field="*{libro.idLibro}" class="form-select" required>
                            <option value="">-- Seleccionar Libro --</option>
                            <option th:each="l : ${libros}"
                                    th:value="${l.idLibro}"
                                    th:text="${l.isbn + ' - ' + l.titulo}">Libro</option>
                        </select>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="codigoInventario" class="form-label">Código de Inventario *</label>
                            <input type="text" th:field="*{codigoInventario}" class="form-control" th:errorclass="is-invalid" placeholder="Ej. KDX-LIB-001-A" required>
                            <div class="invalid-feedback" th:errors="*{codigoInventario}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="estado" class="form-label">Estado Inicial *</label>
                            <select th:field="*{estado}" class="form-select" required>
                                <option th:each="est : ${estados}" th:value="${est}" th:text="${est.nombreVisible}">DISPONIBLE</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="ubicacion" class="form-label">Ubicación Física en Sala / Estante *</label>
                        <input type="text" th:field="*{ubicacion}" class="form-control" th:errorclass="is-invalid" placeholder="Ej. Estante A-1, Pasillo 2, Nivel 3" required>
                        <div class="invalid-feedback" th:errors="*{ubicacion}"></div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a th:href="@{/ejemplares}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Ejemplar
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/kodex.js}"></script>
</body>
</html>
