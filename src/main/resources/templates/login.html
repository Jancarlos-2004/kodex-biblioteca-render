<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - KODEX Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/kodex.css}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 16px;
            padding: 2.25rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
        }
        .brand-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-icon">
                <i class="fa-solid fa-book-bookmark"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">KODEX</h3>
            <p class="text-muted small">Sistema Integral de Gestión de Biblioteca con Préstamos</p>
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle">Universitaria Tecnológica de Santander</span>
        </div>

        <!-- Alertas de error y logout -->
        <div th:if="${error}" class="alert alert-danger py-2 small d-flex align-items-center mb-3">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            <span th:text="${error}"></span>
        </div>
        <div th:if="${mensaje}" class="alert alert-success py-2 small d-flex align-items-center mb-3">
            <i class="fa-solid fa-circle-check me-2"></i>
            <span th:text="${mensaje}"></span>
        </div>

        <!-- Formulario de Inicio de Sesión (SDD-01) -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="correo" class="form-label">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-envelope text-muted"></i></span>
                    <input type="email" class="form-control" id="correo" name="correo" placeholder="ejemplo@kodex.com" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="clave" class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" class="form-control" id="clave" name="clave" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Ingresar al Sistema
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center text-muted small">
            <a th:href="@{/}" class="text-decoration-none text-secondary">
                <i class="fa-solid fa-arrow-left me-1"></i> Volver a la página principal
            </a>
        </div>
    </div>
</body>
</html>
