<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Reserva - KODEX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/kodex.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div id="page-content-wrapper">
        <div th:replace="~{layout/topbar :: topbar}"></div>
        <main class="main-content">
            <div th:replace="~{layout/alerts :: alerts}"></div>

            <div class="card shadow-sm border p-4 mx-auto" style="max-width: 650px;">
                <div class="d-flex align-items-center mb-3 pb-3 border-bottom">
                    <i class="fa-solid fa-clock-rotate-left text-primary fs-3 me-3"></i>
                    <div>
                        <h4 class="fw-bold mb-0">Solicitud de Reserva de Libro</h4>
                        <small class="text-muted">Aplica regla de negocio SDD-16: solo permitida cuando no existan copias disponibles.</small>
                    </div>
                </div>

                <form th:action="@{/reservas/guardar}" method="post">
                    <div class="mb-3">
                        <label for="idLibro" class="form-label">Obra Bibliográfica a Reservar *</label>
                        <select name="idLibro" id="idLibro" class="form-select" required>
                            <option value="">-- Seleccione un Libro --</option>
                            <option th:each="lib : ${libros}"
                                    th:value="${lib.idLibro}"
                                    th:text="${lib.titulo + ' (' + lib.ejemplaresDisponibles + ' disponibles)'}"
                                    th:selected="${idLibroPreseleccionado != null && idLibroPreseleccionado == lib.idLibro}">Libro</option>
                        </select>
                        <div class="form-text small">Nota: Si el libro tiene ejemplares disponibles, el sistema rechazará la reserva e invitará al préstamo directo (SDD-16).</div>
                    </div>

                    <div class="mb-4">
                        <label for="idLector" class="form-label">Lector Solicitante *</label>
                        <select name="idLector" id="idLector" class="form-select" required>
                            <option value="">-- Seleccione un Lector --</option>
                            <option th:each="lec : ${lectores}"
                                    th:value="${lec.idLector}"
                                    th:text="${lec.documento + ' - ' + lec.nombre}">Lector</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a th:href="@{/reservas}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-check me-1"></i> Registrar Reserva
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/kodex.js}"></script>
</body>
</html>
