<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Interno (500) - KODEX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/kodex.css}" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .error-card {
            max-width: 500px;
            background: #ffffff;
            border-radius: 16px;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="text-danger mb-3" style="font-size: 3.5rem;">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h2 class="fw-bold text-dark mb-2">500 - Error del Servidor</h2>
        <p class="text-muted mb-4">
            Se produjo un inconveniente inesperado al procesar la solicitud.
        </p>

        <a th:href="@{/dashboard}" class="btn btn-primary">
            <i class="fa-solid fa-arrow-left me-1"></i> Volver al Inicio
        </a>
    </div>
</body>
</html>
