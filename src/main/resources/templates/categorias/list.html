<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías - KODEX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/kodex.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div id="page-content-wrapper">
        <div th:replace="~{layout/topbar :: topbar}"></div>
        <main class="main-content">
            <div th:replace="~{layout/alerts :: alerts}"></div>

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold text-dark mb-1">
                        <i class="fa-solid fa-tags text-primary me-2"></i>Categorías del Catálogo
                    </h3>
                    <p class="text-muted small mb-0">Organización temática de las obras bibliográficas (SDD-02).</p>
                </div>
                <a th:href="@{/categorias/nueva}" class="btn btn-primary">
                    <i class="fa-solid fa-plus me-1"></i> Nueva Categoría
                </a>
            </div>

            <div class="card card-table">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre de Categoría</th>
                                <th>Descripción</th>
                                <th class="text-center">Libros Asociados</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${categorias}">
                                <td class="text-muted fw-bold" th:text="${c.idCategoria}">1</td>
                                <td class="fw-semibold text-dark" th:text="${c.nombre}">Ingeniería</td>
                                <td class="text-muted" th:text="${c.descripcion}">Descripción</td>
                                <td class="text-center">
                                    <span class="badge bg-light text-dark border" th:text="${c.libros != null ? c.libros.size() : 0}">0</span>
                                </td>
                                <td class="text-end">
                                    <div class="d-inline-flex gap-1">
                                        <a th:href="@{/categorias/editar/{id}(id=${c.idCategoria})}" class="btn btn-sm btn-outline-primary" title="Editar">
                                            <i class="fa-solid fa-pen-to-square"></i>
                                        </a>
                                        <form th:action="@{/categorias/eliminar/{id}(id=${c.idCategoria})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar"
                                                    data-confirm="¿Está seguro de eliminar esta categoría? Solo se permitirá si no contiene libros.">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(categorias)}">
                                <td colspan="5" class="text-center py-4 text-muted">No hay categorías registradas.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/kodex.js}"></script>
</body>
</html>
