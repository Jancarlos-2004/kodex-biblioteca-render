<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Categoría - KODEX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/kodex.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div id="page-content-wrapper">
        <div th:replace="~{layout/topbar :: topbar}"></div>
        <main class="main-content">
            <div th:replace="~{layout/alerts :: alerts}"></div>

            <div class="card shadow-sm border p-4 mx-auto" style="max-width: 600px;">
                <div class="d-flex align-items-center mb-3 pb-3 border-bottom">
                    <i class="fa-solid fa-tags text-primary fs-3 me-3"></i>
                    <div>
                        <h4 class="fw-bold mb-0" th:text="${categoria.idCategoria == null ? 'Nueva Categoría' : 'Editar Categoría'}">Categoría</h4>
                        <small class="text-muted">Defina un nombre único descriptivo (SDD-02).</small>
                    </div>
                </div>

                <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post">
                    <input type="hidden" th:field="*{idCategoria}">

                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre de Categoría *</label>
                        <input type="text" th:field="*{nombre}" class="form-control" th:errorclass="is-invalid" placeholder="Ej. Arquitectura de Software" required>
                        <div class="invalid-feedback" th:errors="*{nombre}"></div>
                    </div>

                    <div class="mb-4">
                        <label for="descripcion" class="form-label">Descripción</label>
                        <textarea th:field="*{descripcion}" class="form-control" rows="3" placeholder="Breve resumen temático..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a th:href="@{/categorias}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Categoría
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/kodex.js}"></script>
</body>
</html>
