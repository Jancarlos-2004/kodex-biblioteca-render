# ===================================================================
# KODEX - Configuración para despliegue en Render (PostgreSQL gratis)
# Las credenciales llegan como variables de entorno desde render.yaml.
# ===================================================================
spring.application.name=kodex-biblioteca

# Render inyecta el puerto en la variable PORT (por defecto 8080 local)
server.port=${PORT:8080}
server.servlet.context-path=/

# -------------------------------------------------------------------
# Conexión a Base de Datos (Render Postgres)
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kodex_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# Configuración JPA / Hibernate
# DataInitializer crea las tablas y los datos semilla al arrancar.
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# Configuración Thymeleaf
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.kodex=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
