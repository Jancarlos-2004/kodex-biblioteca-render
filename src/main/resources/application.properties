# ===================================================================
# KODEX - Configuración para despliegue en Render (PostgreSQL gratis)
# ===================================================================
spring.application.name=kodex-biblioteca

# Render inyecta el puerto real en PORT (por defecto 8080 en local)
server.port=${PORT:8080}
server.servlet.context-path=/

# -------------------------------------------------------------------
# Conexión a Base de Datos
# Render entrega los datos por separado; se arma la URL JDBC correcta.
# -------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:kodex_db}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# Configuración JPA / Hibernate
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# Configuración Thymeleaf
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.kodex=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
